ServerRoot "/usr/local/apache2"
Listen 80

# ── Modules de Proxy & Sécurité ──────────────────────────────
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so

# ── Headers de Sécurité OWASP ────────────────────────────────
Header always set X-Frame-Options "DENY"
Header always set X-Content-Type-Options "nosniff"
Header always set X-XSS-Protection "1; mode=block"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

# ── Logs (SOC 2 CC7.2) ───────────────────────────────────────
ErrorLog /usr/local/apache2/logs/error.log
CustomLog /usr/local/apache2/logs/access.log combined

# ── Proxy API Backend (FastAPI - Port 8000) ──────────────────
<Location "/api">
    ProxyPreserveHost On
    ProxyPass "http://backend:8000/api"
    ProxyPassReverse "http://backend:8000/api"
</Location>

# ── Proxy Frontend React (Port 3000) ─────────────────────────
<VirtualHost *:80>
    ProxyPreserveHost On
    ProxyPass "/" "http://frontend:3000/"
    ProxyPassReverse "/" "http://frontend:3000/"
</VirtualHost>

# ── Interdire les fichiers sensibles (ISO 27001 A.9) ─────────
<Files ".env">
    Require all denied
</Files>
<Files "*.db">
    Require all denied
</Files>