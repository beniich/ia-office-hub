
version: '3.8'
services:
  backend:
    build: 
      context: ../..
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8000:8000"
    env_file: ../../.env
  frontend:
    image: node:16
    ports:
      - "3000:3000"
  apache_proxy:
    image: httpd:latest
    ports:
      - "80:80"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf
